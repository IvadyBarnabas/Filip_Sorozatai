<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filip Sorozatai</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="kepek/icon.png">
</head>

<body>

<header id="header">
    <div class="header-container">
        <a href="index.html"><h1>Filip Sorozatai</h1></a>
        <nav>
            <a href="index.html">Főoldal</a>
            <a href="index.html">Filmek</a>
            <a href="#" id="Discord">Discord</a> 
            <a href="#about">Rólunk</a>
            <a href="#infos">Elérhetőségünk</a>
        </nav>
    </div>

</header>

<!-- LOGIN MODAL -->
<div id="authModal" class="modal">
    <div class="modal-content">

        <h2 id="formTitle">Bejelentkezés</h2>

        <input type="text" id="username" placeholder="Felhasználónév">
        <input type="password" id="password" placeholder="Jelszó">

        <button onclick="login()">Belépés</button>
        <button onclick="register()">Regisztráció</button>
        <button onclick="guestLogin()">Folytatás vendégként</button>

        <p onclick="toggleForm()" id="switchText">Nincs fiókod? Regisztrálj</p>

    </div>
</div>

<h2 style="text-align:center;">Válassz sorozatot 👇</h2>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Keresés sorozatra...">
</div>

<!-- 🎯 KATEGÓRIA SZŰRÉS -->
<div class="filters">
    <button onclick="setCategory('all')">Összes</button>
    <button onclick="setCategory('Akció')">Akció</button>
    <button onclick="setCategory('Horror')">Horror</button>
    <button onclick="setCategory('Vígjáték')">Vígjáték</button>
    <button onclick="setCategory('Sci-fi')">Sci-fi</button>
    <button onclick="setCategory('retro')">80/90-es évek</button>
    <button onclick="toggleFavorites()">❤️ Kedvencek</button>
</div>

<div class="movie-grid" id="movie"></div>

<div class="pagination">
    <button onclick="prevPage()">⬅ Előző</button>
    <span id="pageNum">1</span>
    <button onclick="nextPage()">Következő ➡</button>
</div>

<script>

const movies = [
    {id:"invincible", title:"Invincible", img:"kepek/invincible.webp", info:"Sci-fi/Akció • 2021"},
    {id:"strangerthings", title:"Stranger Things", img:"kepek/strangerthings.webp", info:"Sci-fi/Akció • 2016"},
    {id:"ninjago", title:"Lego Ninjago", img:"kepek/legoninjago.webp", info:"Kaland/Gyerek • 2011"},
    {id:"dragonrising", title:"Lego Ninjago: Dragon Rising", img:"kepek/dragonrising.webp", info:"Kaland/Gyerek • 2023"},
    {id:"spectaculerspiderman", title:"The Spectacular Spider-man", img:"kepek/spectaculerspiderman.webp", info:"Akció/Kaland • 2008"},
    {id:"ben10omni", title:"Ben 10: Omniverse", img:"kepek/ben10omni.webp", info:"Akció/Kaland • 2012"},
    {id:"thebatman2004", title:"The Batman", img:"kepek/thebatman2004.webp", info:"Akció/Kaland • 2004"},
    {id:"batmanbeyond", title:"Batman Beyond", img:"kepek/batmanbeyond.webp", info:"Akció/Kaland • 1999"},
    {id:"prime", title:"Transformers Prime", img:"kepek/prime.webp", info:"Akció/Sci-fi • 2010"},
    {id:"pacificrimtheblack", title:"Pacific Rim: The Black", img:"kepek/pacificrimtheblack.webp", info:"Sci-fi/Akció • 2021"},
    {id:"mk", title:"Moon Knight", img:"kepek/mk.webp", info:"Akció • 2022"},
    {id:"daredevil", title:"Daredevil: Born Again", img:"kepek/daredevil_bornagain.webp", info:"Akció • 2025"},
    {id:"mando", title:"Mandalorian", img:"kepek/mando.webp", info:"Akció/Sci-fi • 2025"},
    {id:"theboys", title:"The Boys", img:"kepek/theboys.webp", info:"Akció • 2019"},
    {id:"breakingbad", title:"Breaking Bad", img:"kepek/breakingbad.webp", info:"Dráma • 2008"},
];

let currentPage = 1;
const perPage = 20;
let searchTerm = "";
let currentCategory = "all";
let showFavorites = false;

// ❤️ FAVORITE
function getFavorites(){
    return JSON.parse(localStorage.getItem("favs")) || [];
}

function toggleFavorite(id){
    let favs = getFavorites();
    if(favs.includes(id)){
        favs = favs.filter(f => f !== id);
    } else {
        favs.push(id);
    }
    localStorage.setItem("favs", JSON.stringify(favs));
    renderMovies();
}

// ⭐ RATING
function setRating(id, rating){
    let ratings = JSON.parse(localStorage.getItem("ratings")) || {};
    
    // ha ugyanarra kattint → törlés
    if(ratings[id] === rating){
        delete ratings[id];
    } else {
        ratings[id] = rating;
    }

    localStorage.setItem("ratings", JSON.stringify(ratings));
    renderMovies();
}

function getRating(id){
    let ratings = JSON.parse(localStorage.getItem("ratings")) || {};
    return ratings[id] || 0;
}

// 🎯 CATEGORY
function setCategory(cat){
    currentCategory = cat;
    showFavorites = false;
    currentPage = 1;
    renderMovies();
}

// ❤️ FAVORITE FILTER
function toggleFavorites(){
    showFavorites = !showFavorites;
    currentPage = 1;
    renderMovies();
}

// SEARCH
document.getElementById("searchInput").addEventListener("input", function(e){
    searchTerm = e.target.value.toLowerCase();
    currentPage = 1;
    renderMovies();
});

function renderMovies(){
    const grid = document.getElementById("movie");
    grid.innerHTML = "";

    const favs = getFavorites();

    let filtered = movies.filter(movie =>
        movie.title.toLowerCase().includes(searchTerm)
    );

    if(currentCategory === "retro"){
    filtered = filtered.filter(movie => {
        const year = parseInt(movie.info.split("•")[1]);
        return year >= 1980 && year <= 1999;
    });
    }
    else if(currentCategory !== "all"){
        filtered = filtered.filter(movie => movie.info.includes(currentCategory));
    }

    if(showFavorites){
        filtered = filtered.filter(movie => favs.includes(movie.id));
    }

    const start = (currentPage - 1) * perPage;
    const pageMovies = filtered.slice(start, start + perPage);

    pageMovies.forEach(movie => {

        let rating = getRating(movie.id);
        let stars = "";

        for(let i=1;i<=5;i++){
            stars += `<span class="star ${i<=rating?"active":""}" onclick="event.stopPropagation();setRating('${movie.id}',${i})">★</span>`;
        }

        grid.innerHTML += `
        <div class="movie-block" onclick="goToMovie('${movie.id}')">
            <div class="favorite" onclick="event.stopPropagation();toggleFavorite('${movie.id}')">
                ${favs.includes(movie.id) ? "❤️" : "🤍"}
            </div>
            <img src="${movie.img}">
            <div class="movie-info">
                <p>${movie.info}</p>
                <div class="stars">${stars}</div>
                <button>▶ Lejátszás</button>
            </div>
            <h3>${movie.title}</h3>
        </div>
        `;
    });

    document.getElementById("pageNum").innerText = currentPage;
}

function goToMovie(id){
    window.location.href = "filmek.html?film=" + id;
}

function nextPage(){
    currentPage++;
    renderMovies();
}

function prevPage(){
    if(currentPage > 1){
        currentPage--;
        renderMovies();
    }
}

renderMovies();
// USER
function renderUser(){
    const user = localStorage.getItem("loggedUser");
    const box = document.getElementById("userBox");

    if(!user){ box.innerHTML=""; return; }

    let name = user === "guest" ? "Vendég" : user;

    box.innerHTML = `
        <span>👤 ${name}</span>
        <button onclick="logout()">Kilépés</button>
    `;
}

function logout(){
    localStorage.removeItem("loggedUser");
    location.reload();
}

// LOGIN SYSTEM
window.onload = function(){
    const user = localStorage.getItem("loggedUser");
    if(user){
        document.getElementById("authModal").style.display="none";
    }
    renderUser();
    renderMovies();
}

function login(){
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    let users = JSON.parse(localStorage.getItem("users")) || [];

    let found = users.find(u => u.username === username && u.password === password);

    if(found){
        localStorage.setItem("loggedUser", username);
        document.getElementById("authModal").style.display="none";
        renderUser();
    } else {
        alert("Hibás adatok!");
    }
}

function register(){
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    let users = JSON.parse(localStorage.getItem("users")) || [];

    if(users.find(u => u.username === username)){
        alert("Ez a név már foglalt!");
        return;
    }

    users.push({username,password});
    localStorage.setItem("users", JSON.stringify(users));
    alert("Sikeres regisztráció!");
}

function guestLogin(){
    localStorage.setItem("loggedUser","guest");
    document.getElementById("authModal").style.display="none";
    renderUser();
}

let isLogin = true;
function toggleForm(){
    isLogin = !isLogin;
    document.getElementById("formTitle").innerText = isLogin ? "Bejelentkezés" : "Regisztráció";
    document.getElementById("switchText").innerText = isLogin ? "Nincs fiókod? Regisztrálj" : "Van fiókod? Jelentkezz be";
}

// HEADER RANDOM
const kepek = [
    "kepek/header1.webp",
    "kepek/header2.webp",
    "kepek/header3.webp",
    "kepek/header4.webp",
    "kepek/header5.webp",
    "kepek/header6.webp"
];

let random = Math.floor(Math.random() * kepek.length);

document.getElementById("header").style.backgroundImage =
`linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7)), url('${kepek[random]}')`;

</script>
<footer>
    <p>&copy; Filip Corvina - Minden jog fenntartva.</p>
</footer>
</body>
</html>
